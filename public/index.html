<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>趋势终端 · A股买卖点分析</title>
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0c0f">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<script>
// ECharts CDN 多源回退：jsdelivr 不可达时依次尝试 unpkg / cdnjs
(function () {
  var sources = [
    'https://unpkg.com/echarts@5.5.0/dist/echarts.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js'
  ];
  function tryNext() {
    if (window.echarts || !sources.length) return;
    var s = document.createElement('script');
    s.src = sources.shift();
    s.onerror = tryNext;
    s.onload = function () { if (!window.echarts) tryNext(); };
    document.head.appendChild(s);
  }
  if (!window.echarts) tryNext();
})();
</script>
<style>
/* ==========================================================================
   趋势终端 · 视觉系统 v5.1
   参考交易所（OKX 系）暗色终端语言重做，类名 100% 沿用，JS 无需改动。

   核心设计决策：
   1. 交互色（蓝）与市场方向色（红/绿）彻底分离。原版把 #ff9800 橙色同时
      用于「可点击」「警告」「MA60」「杯柄买点」四种含义，语义互相污染。
   2. 分层表面代替纯黑。#0A0C0F → #12161B → #1A1F26 三级，靠明度而非
      边框区分层次，密集数据下眼睛不累。
   3. 全站数字 tabular-nums。价格跳动时字宽不变，不会左右抖动。
   4. 唯一的signature：决策环（.sum-score-big 径向仪表盘）。
      其余一切保持克制。
   ========================================================================== */

:root {
  /* 表面 —— OKX 暖灰基底，比冷蓝灰更沉稳 */
  --bg: #0d1117;
  --s1: #161b22;
  --s2: #21262d;
  --s3: #2d333b;
  --line: rgba(255, 255, 255, 0.06);
  --line-2: rgba(255, 255, 255, 0.12);

  /* 文本 */
  --t1: #eaecef;
  --t2: #8b949e;
  --t3: #6e7681;

  /* 市场方向（A股口径：红涨绿跌） */
  --up: #ff4d5a;
  --up-2: #ff8a95;
  --up-soft: rgba(255, 77, 90, 0.12);
  --up-line: rgba(246, 70, 93, 0.22);
  --down: #00d68f;
  --down-2: #4de8a8;
  --down-soft: rgba(0, 214, 143, 0.12);
  --down-line: rgba(14, 203, 129, 0.22);

  /* 交互 —— OKX 核心：交互元素不着色，用白/灰 */
  --ac: #eaecef;
  --ac-2: #ffffff;
  --ac-soft: rgba(255, 255, 255, 0.06);
  --ac-line: rgba(255, 255, 255, 0.15);
  --warn: #fcd535;
  --warn-soft: rgba(252, 213, 53, 0.10);
  --warn-line: rgba(252, 213, 53, 0.22);
  --data: #b7bdc6;
  /* CTA 买入绿 —— OKX 的主行动按钮是绿色（=买入语义） */
  --cta: #00d68f;
  --cta-hover: #1aecA0;

  /* 尺度 */
  --r-s: 5px;
  --r: 8px;
  --r-l: 12px;
  --top-h: 52px;
  --ease: cubic-bezier(0.32, 0.72, 0, 1);

  --ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "PingFang SC",
    "HarmonyOS Sans SC", "Microsoft YaHei", sans-serif;
  --num: ui-monospace, "SF Mono", "JetBrains Mono", "Roboto Mono", Menlo,
    Consolas, monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }

body {
  font-family: var(--ui);
  background: var(--bg);
  color: var(--t2);
  font-size: 13px;
  -webkit-font-smoothing: antialiased;
  font-variant-numeric: tabular-nums;
}

/* 所有数字等宽对齐，价格跳动不抖 */
.qb-price, .qb-pct, .sm-score, .cs-score, .ml-val, .plan-price-val, .plan-val,
.sa-val, .cs-simple-score, .scan-combined, .wp-ov-pct, .wp-ov-score,
.kl-val, .ta-val, .sum-score-big, .cl-signal-time, .scan-table td {
  font-family: var(--num);
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
}

button { font-family: inherit; }
button:focus-visible, input:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid rgba(255,255,255,0.35);
  outline-offset: 1px;
}

/* 方向色 */
.up { color: var(--up); }
.down { color: var(--down); }
.flat { color: var(--t2); }

/* ===== 顶栏 ===== */
.topbar {
  display: flex; align-items: center; gap: 10px;
  padding: 0 14px;
  height: var(--top-h); flex-shrink: 0;
  background: rgba(13, 17, 23, 0.92);
  backdrop-filter: blur(20px) saturate(1.6);
  -webkit-backdrop-filter: blur(20px) saturate(1.6);
  border-bottom: 1px solid var(--line);
  position: relative; z-index: 100;
}
.logo {
  font-size: 14px; font-weight: 650; color: var(--t1);
  white-space: nowrap; letter-spacing: 0.02em;
  display: flex; align-items: center; gap: 7px;
}
.logo::before {
  content: ""; width: 3px; height: 15px; border-radius: 2px;
  background: linear-gradient(180deg, var(--up), var(--cta));
}

/* ===== 搜索 ===== */
.search-wrap { position: relative; }
.search-wrap input {
  width: 190px; padding: 7px 11px;
  background: var(--s2); border: 1px solid transparent;
  color: var(--t1); border-radius: var(--r-s); font-size: 13px;
  transition: background 0.15s, border-color 0.15s;
}
.search-wrap input:hover { background: var(--s3); }
.search-wrap input:focus {
  outline: none; background: var(--s3);
  border-color: rgba(255,255,255,0.18);
  box-shadow: 0 0 0 2px rgba(255,255,255,0.04);
}
.search-wrap input::placeholder { color: var(--t3); }
.search-results {
  position: absolute; top: 38px; left: 0; z-index: 200;
  background: var(--s2); border: 1px solid var(--line-2);
  border-radius: var(--r); max-height: 300px; overflow-y: auto;
  width: min(268px, calc(100vw - 28px)); display: none; padding: 4px;
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
}
.sr-item {
  padding: 8px 10px; cursor: pointer; font-size: 13px;
  border-radius: var(--r-s); display: flex; gap: 10px; align-items: center;
  transition: background 0.1s;
}
.sr-item:hover { background: var(--s3); }
.sr-item .code { color: var(--t2); font-family: var(--num); font-size: 12px; }
.sr-item .name { color: var(--t1); }

/* ===== 行情条 ===== */
.quote-bar {
  display: flex; align-items: baseline; gap: 10px; margin-left: auto;
  padding-left: 12px;
}
.qb-name { font-size: 14px; font-weight: 600; color: var(--t1); }
.qb-price { font-size: 22px; font-weight: 650; line-height: 1; }
.qb-pct { font-size: 14px; font-weight: 600; }
.qb-meta { font-size: 11px; color: var(--t3); }

/* 价格闪烁 —— 交易所标配的即时反馈 */
@keyframes flashUp {
  0% { background: var(--up-soft); box-shadow: 0 0 0 4px var(--up-soft); }
  100% { background: transparent; box-shadow: none; }
}
@keyframes flashDown {
  0% { background: var(--down-soft); box-shadow: 0 0 0 4px var(--down-soft); }
  100% { background: transparent; box-shadow: none; }
}
.qb-price.flash-up { animation: flashUp 0.7s var(--ease); border-radius: 3px; }
.qb-price.flash-down { animation: flashDown 0.7s var(--ease); border-radius: 3px; }

/* ===== 主按钮 ===== */
.scan-btn {
  padding: 7px 15px; font-size: 12.5px; font-weight: 600;
  background: var(--cta); color: #0b0e11;
  border: none; border-radius: var(--r-s); cursor: pointer;
  white-space: nowrap; transition: filter 0.15s, transform 0.1s;
}
.scan-btn:hover { filter: brightness(1.12); }
.scan-btn:active { transform: scale(0.97); }
.scan-btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; filter: none; }

/* ===== 分段控件（工具栏 / 模式 / 指标 / 资金流）=====
   统一成 pill segmented control，比原版的描边小方块更贴近交易所语言 */
.chart-toolbar, .indicator-toolbar {
  display: flex; align-items: center; gap: 2px;
  padding: 7px 12px; background: var(--bg);
  border-bottom: 1px solid var(--line); flex-shrink: 0;
}
.indicator-toolbar { padding: 5px 12px; }

.tb-btn, .it-btn, .mt-btn, .ft-btn, .hs-btn, .wc-btn, .scan-analyze-btn, .wp-clear {
  padding: 5px 10px; font-size: 12px; font-weight: 500;
  background: transparent; border: 1px solid transparent;
  color: var(--t2); cursor: pointer; border-radius: var(--r-s);
  transition: background 0.13s, color 0.13s;
  white-space: nowrap;
}
.tb-btn:hover, .it-btn:hover, .mt-btn:hover, .ft-btn:hover,
.hs-btn:hover, .wc-btn:hover, .scan-analyze-btn:hover, .wp-clear:hover {
  color: var(--t1); background: var(--s2);
}
.tb-btn:active, .it-btn:active, .mt-btn:active, .hs-btn:active { transform: scale(0.97); }

.tb-btn.active, .it-btn.active, .mt-btn.active, .ft-btn.ft-active, .wc-btn.active {
  color: var(--t1); background: var(--s3);
  border-color: transparent; font-weight: 600;
}
.tb-btn.active { box-shadow: inset 0 -2px 0 var(--t1); }

.tb-sep { width: 1px; height: 14px; background: var(--line); margin: 0 7px; }
.tb-label { font-size: 11px; color: var(--t3); font-family: var(--num); }

.hot-stocks { display: flex; gap: 2px; margin-left: 4px; }
.hs-btn { padding: 5px 9px; font-size: 11.5px; }

.mode-toggle {
  display: flex; gap: 2px; padding: 2px;
  background: var(--s2); border-radius: var(--r-s);
}
.mt-btn { padding: 4px 11px; }

.flow-toggle { margin-left: auto; display: flex; gap: 2px; }
.ft-btn { padding: 3px 9px; font-size: 11px; }
.ft-btn.ft-active { color: var(--t1); background: var(--ac-soft); }

/* ===== 布局 ===== */
.main {
  display: grid; grid-template-columns: 1fr 344px;
  gap: 0; background: var(--bg);
  border-left: 0;
  height: calc(100vh - var(--top-h));
}
.left-panel { background: var(--bg); display: flex; flex-direction: column; overflow: hidden; }
.right-panel {
  background: var(--s1); overflow-y: auto; padding: 10px;
  border-left: 1px solid var(--line-2);
  display: flex; flex-direction: column; gap: 10px;
}
/* flex 子项默认 min-height:auto 仍会被压缩，必须显式禁止收缩 */
.right-panel > * { flex: 0 0 auto; }
@media (max-width: 1100px) {
  .main { grid-template-columns: 1fr; height: auto; overflow-y: auto; }
  html, body { overflow: auto; }
  .quote-bar { margin-left: 0; }
  .topbar { flex-wrap: wrap; height: auto; padding: 8px 12px; gap: 8px; }
}

/* ===== 图表 ===== */
.chart-container { flex: 1; display: flex; flex-direction: column; position: relative; }
#kline-chart { width: 100%; flex: 1; min-height: 200px; }
#volume-chart { width: 100%; height: 88px; flex-shrink: 0; }
#minute-chart { width: 100%; flex: 1; min-height: 200px; display: none; }
#minute-vol { width: 100%; height: 88px; flex-shrink: 0; display: none; }
#indicator-chart { width: 100%; height: 92px; flex-shrink: 0; display: none; }

.flow-section { height: 132px; flex-shrink: 0; border-top: 1px solid var(--line); }
.flow-section .fs-title {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 12px 3px; font-size: 11px; font-weight: 600;
  color: var(--t2); letter-spacing: 0.04em; text-transform: uppercase;
}
#flow-chart { width: 100%; height: 100px; }

/* ===== 卡片 ===== */
.signal-card, .summary-card, .plan-card, .chanlun-card, .signal-accuracy-card {
  background: var(--s1);
  border: 1px solid var(--line);
  border-radius: var(--r-l);
  overflow: hidden;
  transition: border-color 0.18s;
}
.signal-card:hover, .summary-card:hover, .plan-card:hover, .chanlun-card:hover {
  border-color: rgba(255,255,255,0.06);
}
.sc-header {
  display: flex; align-items: center; gap: 7px;
  padding: 10px 13px;
  font-size: 11.5px; font-weight: 650; color: var(--t2);
  letter-spacing: 0.05em; text-transform: uppercase;
  border-bottom: 1px solid var(--line-2);
  cursor: pointer; user-select: none;
}
.sc-header .sc-arrow {
  font-size: 8px; color: var(--t3); flex-shrink: 0;
  display: inline-block; width: 9px;
  transition: transform 0.22s var(--ease);
}
.signal-card.collapsed .sc-arrow { transform: rotate(-90deg); }
.signal-card.collapsed > :not(.sc-header) { display: none !important; }
.signal-card.collapsed .sc-header { border-bottom: none; }

/* ===== 决策卡（signature：径向仪表盘）===== */
.sum-body { padding: 13px; }
.sum-action-row { display: flex; align-items: center; gap: 9px; margin-bottom: 10px; }
.sum-badge {
  font-size: 13px; font-weight: 700; padding: 5px 12px;
  border-radius: 999px; letter-spacing: 0.02em;
}
.sum-badge-buy { background: var(--up-soft); color: var(--up); border: 1px solid var(--up-line); }
.sum-badge-sell { background: var(--down-soft); color: var(--down-2); border: 1px solid var(--down-line); }
.sum-badge-watch { background: var(--s3); color: var(--t2); border: 1px solid var(--line-2); }
.sum-badge-cautious { background: rgba(240,185,11,0.06); color: #f0b90b; border: 1px solid rgba(240,185,11,0.14); }

.sum-strength { font-size: 11px; font-weight: 600; padding: 3px 7px; border-radius: var(--r-s); background: var(--s2); }
.sum-strength.strong { color: var(--up-2); }
.sum-strength.medium { color: var(--warn); }
.sum-strength.weak { color: var(--t3); }

/* 决策环：conic-gradient 由 --score 驱动，JS 只需 setProperty */
.sum-score-big {
  margin-left: auto; position: relative; flex-shrink: 0;
  width: 60px; height: 60px; border-radius: 50%;
  display: grid; place-items: center;
  font-size: 0;
  background:
    conic-gradient(currentColor calc(var(--score, 0) * 3.6deg),
      rgba(255, 255, 255, 0.05) 0);
  /* score=0 时不画弧，避免 0deg 处的细缝 */
  mask: radial-gradient(farthest-side, transparent 62%, #000 63%);
  -webkit-mask: radial-gradient(farthest-side, transparent 62%, #000 63%);
}
.sum-score-wrap {
  margin-left: auto; position: relative;
  width: 60px; height: 60px; flex-shrink: 0;
  display: grid; place-items: center;
}
.sum-score-wrap .sum-score-big { position: absolute; inset: 0; margin: 0; }
.sum-score-num {
  position: relative; z-index: 1;
  font-family: var(--num); font-size: 19px; font-weight: 700;
  line-height: 1; letter-spacing: -0.04em;
}
.sum-score-unit { font-size: 8px; color: var(--t3); display: block; text-align: center; margin-top: 1px; letter-spacing: 0.08em; }

.sum-text { font-size: 12.5px; color: var(--t1); line-height: 1.65; }
.sum-risk-row {
  display: flex; align-items: center; gap: 7px;
  margin-top: 10px; padding-top: 9px;
  border-top: 1px solid var(--line);
  font-size: 11.5px;
}
.sum-risk-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.sum-risk-dot.low { background: var(--down); box-shadow: 0 0 6px var(--down); }
.sum-risk-dot.mid { background: var(--warn); box-shadow: 0 0 6px var(--warn); }
.sum-risk-dot.high { background: var(--up); box-shadow: 0 0 6px var(--up); }

/* ===== 模块评分（订单簿深度条语言）===== */
.module-list { padding: 10px 13px; }
.ml-row {
  display: flex; align-items: center; gap: 9px; margin-bottom: 7px;
  position: relative;
}
.ml-row:last-child { margin-bottom: 0; }
.ml-name {
  width: 72px; font-size: 11px; color: var(--t2); flex-shrink: 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.ml-bar-bg {
  flex: 1; height: 21px; background: var(--s2);
  border-radius: var(--r-s); overflow: hidden; position: relative;
  min-width: 0;
}
.ml-bar { position: relative; }
.ml-bar {
  height: 100%; border-radius: var(--r-s);
  transition: width 0.6s var(--ease);
  opacity: 0.40;
}
.ml-bar::after {
  content: ""; position: absolute; top: 0; right: 0; bottom: 0;
  width: 2px; background: currentColor;
}
.ml-val {
  width: 26px; text-align: right; font-size: 12px; font-weight: 650;
  flex-shrink: 0;
}

/* ===== 信号列表 ===== */
.sig-list { padding: 7px 13px 11px; max-height: 210px; overflow-y: auto; }
.sig-item {
  font-size: 12px; padding: 6px 9px; margin-bottom: 4px;
  border-radius: var(--r-s); line-height: 1.5;
  border-left: 2px solid transparent;
}
.sig-item:last-child { margin-bottom: 0; }
.sig-buy { background: var(--up-soft); color: var(--up-2); border-left-color: var(--up); }
.sig-sell { background: var(--down-soft); color: var(--down-2); border-left-color: var(--down); }
.sig-risk { background: var(--warn-soft); color: var(--warn); border-left-color: var(--warn); }
.sig-core-tag {
  font-size: 9px; font-weight: 700; padding: 1px 5px; margin-left: 6px;
  border-radius: 3px; background: rgba(255,255,255,0.12); color: var(--t1);
  letter-spacing: 0.04em; vertical-align: 1px;
}

/* ===== CANSLIM 七维 ===== */
.cs-grid {
  display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px;
  padding: 11px 13px; text-align: center;
}
.cs-item {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 6px 2px; border-radius: var(--r-s);
  background: var(--s2); transition: background 0.15s;
}
.cs-item:hover { background: var(--s3); }
.cs-letter { font-size: 12px; font-weight: 700; color: var(--ac-2); }
.cs-score { font-size: 13px; font-weight: 650; }
.cs-label { font-size: 8.5px; color: var(--t3); }

#cs-simple { display: none; padding: 12px 14px; align-items: baseline; }
.cs-simple-score { font-size: 27px; font-weight: 700; }
.cs-simple-label { font-size: 12px; color: var(--t2); margin-left: 8px; }

/* ===== 关键价位 ===== */
.kl-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 10px 13px; }
.kl-item {
  display: flex; justify-content: space-between; align-items: center; gap: 6px;
  font-size: 11px; padding: 6px 8px;
  background: var(--s2); border-radius: var(--r-s);
}
.kl-label { color: var(--t2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kl-val { color: var(--t1); font-weight: 650; flex-shrink: 0; }

/* ===== 操作计划 ===== */
.plan-body { padding: 11px 13px; }
.plan-row {
  display: flex; justify-content: space-between; align-items: baseline;
  gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line);
}
/* 值过长时改为上下排，避免「钱」「盈亏比」这类词被孤立到下一行 */
.plan-row.stacked { flex-direction: column; align-items: stretch; gap: 3px; }
.plan-row.stacked .plan-val { text-align: left; font-size: 12px; line-height: 1.55; }
.plan-val { text-align: right; }
.plan-row:last-child { border-bottom: none; }
.plan-label { font-size: 12px; color: var(--t2); }
.plan-val { font-size: 13px; font-weight: 650; color: var(--t1); }

.plan-prices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin: 9px 0; }
.plan-price-box {
  padding: 9px 6px; background: var(--s2); border-radius: var(--r);
  text-align: center; border: 1px solid transparent;
  transition: border-color 0.15s, background 0.15s;
}
.plan-price-box:hover { background: var(--s3); border-color: var(--line-2); }
.plan-price-label {
  font-size: 9.5px; color: var(--t3); margin-bottom: 4px;
  letter-spacing: 0.03em; line-height: 1.35;
}
.plan-price-label .plan-tip { display: block; font-size: 8.5px; opacity: 0.75; margin-left: 0; }
.plan-price-val { font-size: 15px; font-weight: 700; }
.plan-tip { font-size: 9px; color: var(--t3); margin-left: 2px; font-style: normal; }
.plan-notes {
  font-size: 11px; color: var(--t2); line-height: 1.6;
  padding: 8px 9px; margin-top: 8px;
  background: var(--s2); border-radius: var(--r-s);
  border-left: 2px solid var(--t3);
}
.plan-rr {
  display: flex; gap: 14px; margin-top: 8px; padding-top: 8px;
  border-top: 1px solid var(--line); font-size: 11px;
}
.plan-rr-item { color: var(--t2); }
.plan-rr-item b { color: var(--t1); font-family: var(--num); }

.trade-advice { padding: 10px 13px; font-size: 12px; }
.ta-row { display: flex; justify-content: space-between; padding: 3px 0; }
.ta-label { color: var(--t2); }
.ta-val { font-weight: 650; color: var(--t1); }

/* ===== 缠论 ===== */
.cl-body { padding: 10px 13px; }
.cl-state {
  font-size: 12px; color: var(--t1); line-height: 1.6;
  padding: 8px 9px; margin-bottom: 8px;
  background: var(--s2); border-radius: var(--r-s);
}
.cl-signals { display: flex; flex-direction: column; gap: 4px; }
.cl-signal-item {
  display: flex; align-items: center; gap: 7px;
  font-size: 11px; padding: 6px 8px; border-radius: var(--r-s);
  border-left: 2px solid transparent;
}
.cl-signal-buy { background: var(--up-soft); border-left-color: var(--up); }
.cl-signal-sell { background: var(--down-soft); border-left-color: var(--down); }
.cl-signal-tag {
  font-size: 9.5px; font-weight: 700; padding: 2px 6px;
  border-radius: 3px; flex-shrink: 0; letter-spacing: 0.02em;
}
.cl-signal-tag.buy1 { background: var(--up); color: #fff; }
.cl-signal-tag.buy2 { background: var(--up-soft); color: var(--up-2); border: 1px solid var(--up-line); }
.cl-signal-tag.buy3 { background: var(--warn-soft); color: var(--warn); border: 1px solid var(--warn-line); }
.cl-signal-tag.sell1 { background: var(--down); color: #04140d; }
.cl-signal-tag.sell2 { background: var(--down-soft); color: var(--down-2); border: 1px solid var(--down-line); }
.cl-signal-tag.sell3 { background: var(--s3); color: var(--down-2); border: 1px solid var(--line-2); }
.cl-signal-desc { color: var(--t2); flex: 1; line-height: 1.5; }
.cl-signal-time { color: var(--t3); font-size: 10px; white-space: nowrap; flex-shrink: 0; }
.cl-stats { display: flex; gap: 12px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); font-size: 10.5px; color: var(--t3); }
.cl-zhongshu {
  font-size: 10.5px; padding: 4px 8px; margin-top: 5px;
  background: var(--s2); border: 1px solid var(--line);
  border-radius: var(--r-s); color: var(--t2);
}
.cl-zhongshu-broken { color: var(--warn); }
.cl-zhongshu-current { background: var(--ac-soft); border-color: var(--ac-line); color: var(--t1); }
.cl-plain-summary {
  display: none; font-size: 12px; color: var(--t2); line-height: 1.65;
  padding: 8px 9px; margin-top: 6px;
  background: var(--s2); border-radius: var(--r-s);
}
.cl-plain-summary b { color: var(--t1); }

/* ===== 信号准确率 ===== */
.signal-accuracy-card { display: none; }
.sa-stats { padding: 11px 13px; display: flex; gap: 16px; flex-wrap: wrap; }
.sa-item { display: flex; flex-direction: column; align-items: center; gap: 3px; }
.sa-val { font-size: 19px; font-weight: 700; }
.sa-label { font-size: 10px; color: var(--t3); }
.sa-detail { padding: 5px 13px 10px; font-size: 11px; color: var(--t3); border-top: 1px solid var(--line); }

/* ===== 自选 / 历史面板 ===== */
.watch-wrap { position: relative; display: flex; align-items: center; gap: 3px; }
.wc-btn { padding: 5px 11px; }
.wc-star { font-size: 16px; padding: 4px 8px; line-height: 1; color: var(--t2); }
.wc-star.starred { color: var(--warn); }
.wc-badge, .wc-btn .wc-change-badge {
  position: absolute; top: -3px; right: -3px;
  font-size: 8.5px; font-weight: 700; color: #fff;
  padding: 0 4px; border-radius: 999px;
  min-width: 14px; text-align: center; line-height: 14px;
}
.wc-badge { background: var(--cta); color: #0b0e11; }
.wc-btn .wc-change-badge { background: var(--up); animation: pulse 1.6s ease infinite; }

.wp-panel {
  position: absolute; top: 44px; right: 0; z-index: 300;
  background: var(--s1); border: 1px solid var(--line-2);
  border-radius: var(--r-l); width: 328px;
  max-height: 470px; display: none;
  box-shadow: 0 16px 44px rgba(0, 0, 0, 0.72);
  flex-direction: column; overflow: hidden;
}
.wp-panel.show { display: flex; animation: panelIn 0.2s var(--ease); }
@keyframes panelIn { from { opacity: 0; transform: translateY(-6px); } }

.wp-tabs { display: flex; padding: 4px; gap: 2px; border-bottom: 1px solid var(--line); }
.wp-tab {
  flex: 1; padding: 7px 4px; font-size: 11.5px; font-weight: 500;
  background: transparent; border: none; color: var(--t2);
  cursor: pointer; border-radius: var(--r-s); transition: background 0.13s, color 0.13s;
}
.wp-tab:hover { color: var(--t1); background: var(--s2); }
.wp-tab.active { color: var(--t1); background: var(--s3); font-weight: 650; }
.wp-tab .wp-tab-count { font-size: 10px; color: var(--t3); margin-left: 3px; font-family: var(--num); }
.wp-tab.active .wp-tab-count { color: var(--t1); }

.wp-list { flex: 1; overflow-y: auto; padding: 5px; }
.wp-item {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 9px; border-radius: var(--r-s); cursor: pointer;
  transition: background 0.1s;
}
.wp-item:hover { background: var(--s2); }
.wp-item .code { color: var(--t2); font-size: 11.5px; min-width: 52px; font-family: var(--num); }
.wp-item .name { color: var(--t1); font-size: 12px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wp-item .sig-tag, .wp-ov-sig-tag {
  font-size: 9px; font-weight: 650; padding: 2px 5px;
  border-radius: 3px; flex-shrink: 0;
}
.wp-item .sig-tag.buy, .wp-ov-sig-tag.buy { background: var(--up-soft); color: var(--up-2); }
.wp-item .sig-tag.sell, .wp-ov-sig-tag.sell { background: var(--down-soft); color: var(--down-2); }
.wp-item .sig-tag.watch, .wp-ov-sig-tag.watch { background: var(--warn-soft); color: var(--warn); }
.wp-item .sig-tag.none, .wp-ov-sig-tag.none { background: var(--s2); color: var(--t3); }
.wp-item .time { font-size: 10px; color: var(--t3); white-space: nowrap; font-family: var(--num); }
.wp-item .remove {
  background: none; border: none; color: var(--t3); cursor: pointer;
  font-size: 14px; padding: 0 3px; border-radius: 3px; line-height: 1;
  transition: color 0.12s, background 0.12s;
}
.wp-item .remove:hover { color: var(--up); background: var(--up-soft); }

.wp-empty { padding: 40px 16px; text-align: center; color: var(--t3); font-size: 12px; line-height: 1.9; }
.wp-empty .wp-empty-icon { font-size: 26px; display: block; margin-bottom: 10px; opacity: 0.3; }
.wp-footer {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 11px; border-top: 1px solid var(--line); background: var(--bg);
}
.wp-footer-info { font-size: 10px; color: var(--t3); }
.wp-clear { padding: 4px 9px; font-size: 11px; }
.wp-clear:hover { color: var(--up); background: var(--up-soft); }

.wp-overview { padding: 5px; }
.wp-ov-item {
  display: grid; grid-template-columns: 50px 1fr 46px 44px 38px;
  gap: 5px; align-items: center;
  padding: 7px 9px; border-radius: var(--r-s); cursor: pointer;
  transition: background 0.1s; font-size: 11px;
}
.wp-ov-item:hover { background: var(--s2); }
.wp-ov-code { color: var(--t2); font-family: var(--num); }
.wp-ov-name { color: var(--t1); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wp-ov-pct { text-align: right; font-weight: 650; }
.wp-ov-score { text-align: center; font-weight: 650; color: var(--t1); }
.wp-ov-sig { text-align: center; }
.wp-ov-loading { padding: 24px; text-align: center; color: var(--t3); font-size: 12px; }

/* ===== 扫描弹窗 ===== */
.scan-overlay {
  position: fixed; inset: 0; z-index: 400;
  background: rgba(6, 8, 11, 0.78);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  display: none; justify-content: center; align-items: center;
}
.scan-overlay.show { display: flex; animation: fadeIn 0.18s ease; }
@keyframes fadeIn { from { opacity: 0; } }
.scan-modal {
  background: var(--s1); border: 1px solid var(--line-2);
  border-radius: var(--r-l); width: min(880px, 92vw);
  max-height: 84vh; display: flex; flex-direction: column;
  box-shadow: 0 28px 72px rgba(0, 0, 0, 0.8);
  animation: modalIn 0.24s var(--ease);
}
@keyframes modalIn { from { opacity: 0; transform: translateY(14px) scale(0.985); } }
.scan-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px; border-bottom: 1px solid var(--line);
}
.scan-title { font-size: 14px; font-weight: 650; color: var(--t1); }
.scan-close {
  background: none; border: none; color: var(--t2); font-size: 20px;
  cursor: pointer; padding: 0 4px; line-height: 1; border-radius: var(--r-s);
  transition: color 0.12s;
}
.scan-close:hover { color: var(--t1); }
.scan-body { padding: 18px; overflow-y: auto; flex: 1; }

.scan-progress-wrap { margin-bottom: 18px; }
.scan-stage { font-size: 13px; color: var(--t1); margin-bottom: 9px; }
.scan-bar-bg { width: 100%; height: 6px; background: var(--s3); border-radius: 999px; overflow: hidden; }
.scan-bar-fill {
  height: 100%; border-radius: 999px;
  background: linear-gradient(90deg, var(--cta), #2edc96);
  transition: width 0.4s var(--ease);
  position: relative; overflow: hidden;
}
.scan-bar-fill::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.35), transparent);
  animation: sweep 1.4s linear infinite;
}
@keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
.scan-stats { display: flex; gap: 22px; margin-top: 10px; font-size: 11.5px; color: var(--t3); }
.scan-stats span b { color: var(--t1); font-family: var(--num); }

.scan-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 12.5px; }
.scan-table th {
  padding: 9px 10px; text-align: left; font-size: 10.5px; font-weight: 600;
  color: var(--t3); letter-spacing: 0.05em; text-transform: uppercase;
  border-bottom: 1px solid var(--line-2); position: sticky; top: 0;
  background: var(--s1); z-index: 1;
}
.scan-table td { padding: 10px; border-bottom: 1px solid var(--line); color: var(--t2); }
.scan-table tr { transition: background 0.1s; }
.scan-table tbody tr:hover td { background: var(--s2); }
.scan-rank { color: var(--t3); font-weight: 650; font-family: var(--num); }
.scan-table tbody tr:nth-child(-n+3) .scan-rank { color: var(--cta); }
.scan-action-buy { color: var(--up); font-weight: 650; }
.scan-action-strong { color: var(--up); font-weight: 700; }
.scan-action-caution { color: var(--warn); font-weight: 650; }
.scan-action-watch { color: var(--t3); }
  .scan-combined { font-weight: 700; color: var(--t1); }
.scan-analyze-btn { padding: 4px 10px; font-size: 11px; background: var(--s2); }
.scan-analyze-btn:hover { background: rgba(14,203,129,0.1); color: var(--cta); }
.scan-empty { text-align: center; padding: 48px; color: var(--t3); font-size: 13px; line-height: 1.8; }

/* ===== 加载态：骨架屏取代 spinner ===== */
.loading-overlay {
  position: absolute; inset: 0; z-index: 50;
  background: rgba(10, 12, 15, 0.7);
  backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
  display: none; justify-content: center; align-items: center;
}
.spinner {
  width: 30px; height: 30px; border-radius: 50%;
  border: 2.5px solid var(--s3); border-top-color: var(--ac);
  animation: spin 0.65s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }

/* ===== Tooltip ===== */
#signal-tooltip {
  position: absolute; z-index: 260; display: none;
  pointer-events: none;  /* 否则鼠标移入面板会打断 zr mousemove，面板闪烁 */
  background: rgba(26, 31, 38, 0.97);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--line-2); border-radius: var(--r);
  padding: 11px 13px; max-width: 320px; font-size: 12px;
  color: var(--t1); line-height: 1.6;
  box-shadow: 0 14px 36px rgba(0, 0, 0, 0.66);
}
#signal-tooltip .stt-hint { font-size: 10px; color: var(--t3); margin-top: 6px; }
.stt-title { font-weight: 650; margin-bottom: 5px; font-size: 12.5px; color: var(--t1); }
.stt-formula {
  color: var(--ac-2); font-family: var(--num); font-size: 11px;
  margin: 5px 0; white-space: pre-wrap;
  padding: 6px 8px; background: rgba(255, 255, 255, 0.04);
  border-radius: var(--r-s);
}
.stt-desc { color: var(--t2); margin-top: 5px; }

/* ===== Toast ===== */
.toast-container {
  position: fixed; top: calc(var(--top-h) + 10px); right: 14px; z-index: 500;
  display: flex; flex-direction: column; gap: 8px; pointer-events: none;
}
.toast {
  background: rgba(26, 31, 38, 0.97);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--line-2); border-left: 3px solid var(--t3);
  border-radius: var(--r); padding: 11px 15px; font-size: 12.5px; color: var(--t1);
  box-shadow: 0 12px 34px rgba(0, 0, 0, 0.6); max-width: 360px;
  animation: toastIn 0.32s var(--ease);
  pointer-events: auto; cursor: pointer;
}
.toast.buy { border-left-color: var(--up); }
.toast.sell { border-left-color: var(--down); }
@keyframes toastIn { from { transform: translateX(400px); opacity: 0; } }
@keyframes toastOut { to { transform: translateX(400px); opacity: 0; } }
.toast.removing { animation: toastOut 0.28s ease forwards; }

/* ===== 模式切换 ===== */
.mode-simple .cs-grid { display: none; }
.mode-simple #cs-simple { display: flex !important; }
.mode-simple .chanlun-card .cl-plain-summary { display: block !important; }
.mode-simple .sig-core-tag { display: inline-block !important; }
.mode-pro .cs-grid { display: grid; }
.mode-pro #cs-simple { display: none; }
.mode-pro .cl-plain-summary { display: none; }
.mode-pro .sig-core-tag { display: none; }

/* ===== 滚动条 ===== */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: var(--s3); border-radius: 999px;
  border: 2px solid transparent; background-clip: padding-box;
}
::-webkit-scrollbar-thumb:hover { background: #3a3d42; background-clip: padding-box; }
::-webkit-scrollbar-corner { background: transparent; }

/* ===== 无障碍 ===== */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
  .scan-bar-fill::after { display: none; }
}

</style>
</head>
<body>

<div class="topbar">
  <div class="logo">趋势分析</div>
  <div class="search-wrap">
    <input type="text" id="search-input" placeholder="代码/名称 如 600519" autocomplete="off">
    <div class="search-results" id="search-results"></div>
  </div>
  <div class="hot-stocks">
    <button class="hs-btn" onclick="analyze('600519')">茅台</button>
    <button class="hs-btn" onclick="analyze('601899')">紫金矿业</button>
    <button class="hs-btn" onclick="analyze('600276')">恒瑞医药</button>
    <button class="hs-btn" onclick="analyze('588170')">科创半导体</button>
    <button class="hs-btn" onclick="analyze('000001')">平安银行</button>
  </div>
  <button class="scan-btn" id="scan-btn" onclick="openScan()">扫描买入</button>
  <div class="mode-toggle">
    <button class="mt-btn active" id="mt-pro" onclick="setMode('pro')">专业</button>
    <button class="mt-btn" id="mt-simple" onclick="setMode('simple')">小白</button>
  </div>
  <div class="watch-wrap">
    <button class="wc-btn wc-star" id="star-btn" title="加入/移除自选" onclick="toggleStar()">☆</button>
    <button class="wc-btn" id="watch-btn" style="position:relative" onclick="togglePanel('watch')">自选<span class="wc-badge" id="watch-count" style="display:none">0</span><span class="wc-change-badge" id="watch-change" style="display:none">0</span></button>
    <button class="wc-btn" id="history-btn" onclick="togglePanel('history')">历史<span class="wc-badge" id="history-count" style="display:none">0</span></button>
    <div class="wp-panel" id="wp-panel">
      <div class="wp-tabs">
        <button class="wp-tab active" data-tab="watch" onclick="switchTab('watch')">自选股<span class="wp-tab-count" id="wt-count"></span></button>
        <button class="wp-tab" data-tab="history" onclick="switchTab('history')">历史记录<span class="wp-tab-count" id="ht-count"></span></button>
        <button class="wp-tab" data-tab="overview" onclick="switchTab('overview')">多股一览<span class="wp-tab-count" id="ov-count"></span></button>
      </div>
      <div class="wp-list" id="wp-content-watch"></div>
      <div class="wp-list" id="wp-content-history" style="display:none"></div>
      <div class="wp-list" id="wp-content-overview" style="display:none"></div>
      <div class="wp-footer" id="wp-footer" style="display:none">
        <span class="wp-footer-info" id="wp-footer-info"></span>
        <button class="wp-clear" id="wp-clear-btn" onclick="clearCurrentTab()">清空</button>
      </div>
    </div>
  </div>
  <div class="quote-bar" id="quote-bar">
    <span class="qb-name flat">输入代码开始分析</span>
  </div>
</div>

<div class="main">
  <!-- ===== 左侧：图表 ===== -->
  <div class="left-panel">
    <div class="chart-toolbar">
      <button class="tb-btn active" id="view-dayk">日K</button>
      <button class="tb-btn" id="view-week">周K</button>
      <button class="tb-btn" id="view-minute">分时</button>
      <div class="tb-sep" id="sep-range"></div>
      <button class="tb-btn" data-range="20">1月</button>
      <button class="tb-btn active" data-range="60">3月</button>
      <button class="tb-btn" data-range="120">半年</button>
      <button class="tb-btn" data-range="250">1年</button>
      <button class="tb-btn" data-range="0">全部</button>
      <div class="tb-sep"></div>
      <span class="tb-label" id="zoom-info"></span>
    </div>

    <div class="chart-container">
      <div id="kline-chart"></div>
      <div id="volume-chart"></div>
      <div class="indicator-toolbar" id="indicator-toolbar" style="display:none">
        <button class="it-btn active" data-ind="none" onclick="switchIndicator('none')">副图</button>
        <button class="it-btn" data-ind="macd" onclick="switchIndicator('macd')">MACD</button>
        <button class="it-btn" data-ind="rsi" onclick="switchIndicator('rsi')">RSI</button>
        <button class="it-btn" data-ind="kdj" onclick="switchIndicator('kdj')">KDJ</button>
        <button class="it-btn" data-ind="boll" onclick="switchIndicator('boll')">BOLL</button>
        <button class="it-btn" data-ind="wr" onclick="switchIndicator('wr')">WR</button>
      </div>
      <div id="indicator-chart"></div>
      <div id="minute-chart"></div>
      <div id="minute-vol"></div>
      <div class="flow-section">
        <div class="fs-title">
          <span style="color:var(--ac-2)">资金流向</span>
          <span id="flow-summary"></span>
          <span class="flow-toggle">
            <button class="ft-btn ft-active" id="ft-rt" onclick="switchFlowMode('realtime')">今日实时</button>
            <button class="ft-btn" id="ft-daily" onclick="switchFlowMode('daily')">近30日</button>
          </span>
        </div>
        <div id="flow-chart"></div>
      </div>
      <div class="loading-overlay" id="loading"><div class="spinner"></div></div>
      <div id="signal-tooltip"></div>
    </div>
  </div>

  <!-- ===== 右侧：信号 ===== -->
  <div class="right-panel">
    <!-- 一句话总结（小白第一眼看的） -->
    <div class="summary-card" id="summary-card">
      <div class="sc-header" style="cursor:help" onclick="showEngineInfo()">量化规则结论
        <span style="margin-left:auto;font-size:9px;font-weight:400;color:var(--t3);
                     border:1px solid var(--line-2);border-radius:3px;padding:1px 5px">计算依据</span></div>
      <div class="sum-body" id="sum-body">
        <div class="sum-action-row">
          <span class="sum-badge sum-badge-watch">等待分析</span>
          <span class="sum-strength">--</span>
          <span class="sum-score-big flat">--</span>
        </div>
        <div class="sum-text" style="color:#666">输入股票代码或点击上方热门股票开始分析</div>
      </div>
    </div>

    <!-- 操作计划（具体怎么操作） -->
    <div class="plan-card" id="plan-card" style="display:none">
      <div class="sc-header" style="color:var(--ac-2)">操作计划</div>
      <div class="plan-body" id="plan-body"></div>
    </div>

    <!-- 大盘环境 -->
    <div class="signal-card" id="market-card" style="display:none">
      <div class="sc-header" style="color:var(--data)">大盘环境</div>
      <div id="market-body" style="padding:8px 12px;font-size:12px;line-height:1.6"></div>
    </div>

    <!-- 模块评分 -->

// ===== MA计算 =====
function calcMA(data, period) {
  const result = new Array(data.length).fill(null);
  for (let i = period - 1; i < data.length; i++) {
    let sum = 0;
    for (let j = 0; j < period; j++) sum += data[i - j].close;
    result[i] = +(sum / period).toFixed(3);
  }
  return result;
}

// ===== K线图 =====
/**
 * 前端脏数据兜底。
 * 后端 validateKlines 已加固，但缓存里可能还留着旧的脏数据，
 * 且一根异常K线足以把 y 轴拉到 0、让整张图报废，代价太大，因此双保险。
 * A股单日振幅有涨跌停上限，high/low 比值不可能超过 2.2。
 */
function sanitizeKlines(klines) {
  if (!Array.isArray(klines)) return [];
  const out = [];
  let dropped = 0;
  for (const k of klines) {
    const ok = k && k.close > 0 && k.high > 0 && k.low > 0 && k.open > 0
      && k.high >= k.low && k.high / k.low <= 2.2
      && (!out.length || (k.close / out[out.length - 1].close <= 2.5
                          && k.close / out[out.length - 1].close >= 0.4));
    if (ok) out.push(k); else dropped++;
  }
  if (dropped) {
    console.warn(`[chart] 已过滤 ${dropped} 根异常K线`);
    showToast(`数据源返回 ${dropped} 根异常K线，已自动剔除`, '');
  }
  return out;
}

function renderKline(rawKlines, signal) {
  const klines = sanitizeKlines(rawKlines);
  if (!klines.length) { console.warn('[chart] 无有效K线'); return; }
  _klineData = klines;
  _lastSignalData = signal;
  const dates = klines.map(k => k.date);
  const ohlc = klines.map(k => [k.open, k.close, k.low, k.high]);
  const ma5 = calcMA(klines, 5);
  const ma10 = calcMA(klines, 10);
  const ma20 = calcMA(klines, 20);
  const ma60 = calcMA(klines, 60);

  // 买卖点标记——买入▲在K线下方，卖出▼在K线上方
  const markPoints = [];
  _signalPoints = [];
  if (signal.breakouts) {
    for (const b of signal.breakouts) {
      if (b.signal === '买入') {
        const idx = findEntryIndex(klines, b.entry_price);
        const k = klines[idx];
        // 向下偏移，让标记明显在K线下方
        const candleLow = (k && k.low) ? k.low : (b.entry_price || b.breakout_price);
        const range = k ? (k.high - k.low) : 0;
        const markerY = candleLow - Math.max(range * 0.5, candleLow * 0.005);
        const dateStr = dates[idx] || dates[dates.length-1];
        markPoints.push({
          coord: [dateStr, markerY],
          symbol: 'triangle', symbolSize: 20, symbolRotate: 0,
          itemStyle: { color: C.up, borderWidth: 2, borderColor: '#fff' },
          label: { show: true, formatter: '买入', fontSize: 11, fontWeight: 'bold', color: '#fff',
                   backgroundColor: C.up, padding: [2,4], borderRadius: 3, position: 'bottom' },
        });
        _signalPoints.push({
          date: dateStr, price: markerY,
          title: '买入信号（海龟法则·做多）',
          formula: `突破${b.system || '20日'}最高点 ${b.breakout_price || b.channel_high}\n→ 入场 ${b.entry_price}，止损 ${b.stop_loss}（入场-2×N）`,
          desc: `唐奇安通道：股价突破过去N天最高点时触发买入信号。\nN值=${b.current_n || '?'}（ATR，反映日均波动幅度）。\n入场后止损价=入场价-2×N，跌破止损或触及反向通道退出。`,
        });
      } else if (b.signal === '卖出') {
        const idx = dates.length - 1;
        const k = klines[idx];
        // 向上偏移，让标记明显在K线上方
        const candleHigh = (k && k.high) ? k.high : b.breakout_price;
        const range = k ? (k.high - k.low) : 0;
        const markerY = candleHigh + Math.max(range * 0.5, candleHigh * 0.005);
        markPoints.push({
          coord: [dates[idx], markerY],
          symbol: 'triangle', symbolSize: 20, symbolRotate: 180,
          itemStyle: { color: C.down, borderWidth: 2, borderColor: '#fff' },
          label: { show: true, formatter: '卖出', fontSize: 11, fontWeight: 'bold', color: '#fff',
                   backgroundColor: C.down, padding: [2,4], borderRadius: 3, position: 'top' },
        });
        _signalPoints.push({
          date: dates[idx], price: markerY,
          title: '卖出信号（海龟法则·做空）',
          formula: `跌破${b.system || '20日'}最低点 ${b.breakout_price || b.channel_low}\n→ 入场 ${b.entry_price}，止损 ${b.stop_loss}（入场+2×N）`,
          desc: `唐奇安通道：股价跌破过去N天最低点时触发做空信号。\nN值=${b.current_n || '?'}（ATR，反映日均波动幅度）。\n做空止损价=入场价+2×N，涨到止损或触及反向通道平仓。`,
        });
      }
    }
  }

  // 关键水平线（止损、目标价、支撑/压力）——加粗+背景色突出显示
  // 先判断整体方向：空头持仓时止损在入场价上方
  let isBearish = false;
  if (signal.breakouts) {
    for (const b of signal.breakouts) {
      if (b.entry_price && b.stop_loss && b.stop_loss > b.entry_price) {
        isBearish = true; break;
      }
    }
  }
  if (!isBearish && signal.action) {
    const a = String(signal.action);
    if (a.includes('卖') || a.includes('空') || a.includes('跌')) isBearish = true;
    else if (a.includes('买') || a.includes('涨')) isBearish = false;
  }

  const markLines = [];
  _signalLines = [];
  if (signal.breakouts) {
    for (const b of signal.breakouts) {
      if (b.stop_loss && b.stop_loss > 0) {
        const slLabel = isBearish
          ? `海龟止损 ${b.stop_loss.toFixed(2)}`
          : `海龟止损 ${b.stop_loss.toFixed(2)}`;
        markLines.push({ yAxis: b.stop_loss, lineStyle: { color: C.down, type: [5, 4], width: 1, opacity: 0.85 },
          label: { formatter: slLabel, color: '#04140d', fontSize: 9.5, fontWeight: 'bold', lineHeight: 13,
            backgroundColor: C.down, padding: [3, 5], borderRadius: 3, position: 'insideEndTop' } });
        const nVal = b.current_n || '?';
        _signalLines.push({
          value: b.stop_loss,
          title: isBearish ? '止损价（做空）' : '止损价（做多）',
          formula: isBearish
            ? `${b.entry_price} + 2 × ${nVal} = ${b.stop_loss}`
            : `${b.entry_price} - 2 × ${nVal} = ${b.stop_loss}`,
          desc: isBearish
            ? `海龟法则2N止损。N=${nVal}（ATR平均真实波幅，反映股票日均波动幅度）。\n做空止损在入场价上方：如果股价反弹到这里，说明判断错了，认亏平仓。`
            : `海龟法则2N止损。N=${nVal}（ATR平均真实波幅，反映股票日均波动幅度）。\n做多止损在入场价下方：如果股价跌到这里，说明判断错了，认亏卖出。`,
        });
      }
      // 持仓也要显示入场价，方便知道成本位置
      if (b.entry_price && b.entry_price > 0 && b.signal !== '观望') {
        const entryColor = isBearish ? C.down : C.up;
        // 标注「历史」以区别于操作计划里的当前买入价
        const entryText = isBearish
          ? `历史做空 ${b.entry_price.toFixed(2)}`
          : `历史突破 ${b.entry_price.toFixed(2)}`;
        markLines.push({ yAxis: b.entry_price, lineStyle: { color: entryColor, type: 'solid', width: 1.2, opacity: 0.9 },
          label: { formatter: entryText, color: '#fff', fontSize: 9.5, fontWeight: 'bold', lineHeight: 13,
            backgroundColor: entryColor, padding: [3, 5], borderRadius: 3, position: 'insideEndTop' } });
        _signalLines.push({
          value: b.entry_price,
          title: isBearish ? '做空入场价（海龟法则）' : '做多入场价（海龟法则）',
          formula: isBearish
            ? `股价跌破${b.system || '20日'}最低点 → 做空入场 ${b.entry_price}\n当时通道下轨=${b.channel_low}，上轨=${b.channel_high}`
            : `股价突破${b.system || '20日'}最高点 → 做多入场 ${b.entry_price}\n当时通道上轨=${b.channel_high}，下轨=${b.channel_low}`,
          desc: isBearish
            ? `唐奇安通道做空：当股价跌破过去N天的最低点时，触发做空信号。\n入场价=突破时的通道下轨。N值=${b.current_n || '?'}。\n已持有对应天数，止损价在上方。`
            : `唐奇安通道做多：当股价突破过去N天的最高点时，触发做多信号。\n入场价=突破时的通道上轨。N值=${b.current_n || '?'}。\n已持有对应天数，止损价在下方。`,
        });
      }
    }
  }
  // 当前操作计划的价位（与右侧「操作计划」卡片同源，避免两处数字打架）
  const tp = signal.trade_plan || {};
  if (tp.entry_price > 0 && signal.action && signal.action.includes('买入')) {
    markLines.push({ yAxis: tp.entry_price, lineStyle: { color: '#f0b90b', type: 'solid', width: 1, opacity: 0.9 },
      label: { formatter: `计划买入 ${tp.entry_price.toFixed(2)}`, color: '#1a1200', fontSize: 9.5,
        fontWeight: 'bold', backgroundColor: 'rgba(240,185,11,0.9)', padding: [3, 5], borderRadius: 3, position: 'insideEndBottom' } });
    _signalLines.push({
      value: tp.entry_price,
      title: '计划买入价（当前）',
      formula: `= 最新收盘价 ${tp.entry_price.toFixed(2)}`,
      desc: '这是「操作计划」卡片里的买入价，等于当前价格。\n'
        + '注意与图上标着「历史突破」的那条线区分 —— 后者是海龟法则几天前的入场价，不是现在的买点。',
    });
  }
  if (tp.stop_loss > 0 && signal.action && signal.action.includes('买入')) {
    markLines.push({ yAxis: tp.stop_loss, lineStyle: { color: C.down, type: 'solid', width: 1, opacity: 0.75 },
      label: { formatter: `计划止损 ${tp.stop_loss.toFixed(2)}`, color: '#04140d', fontSize: 9.5,
        fontWeight: 'bold', backgroundColor: C.down, padding: [3, 5], borderRadius: 3, position: 'insideEndBottom' } });
  }

  // 形态目标价
  if (signal.patterns) {
    for (const p of signal.patterns) {
      if (p.target_price && p.target_price > 0) {
        const curPx = _klineData.length ? _klineData[_klineData.length - 1].close : 0;
        const pBearish = p.direction === '看跌';
        // 方向与位置矛盾的目标位不画，避免出现「目标低于现价却写着涨到这里就卖」
        if (curPx > 0) {
          if (!pBearish && p.target_price <= curPx) continue;
          if (pBearish && p.target_price >= curPx) continue;
        }
        const targetLabel = pBearish
          ? `下行目标 ${p.target_price.toFixed(2)}`
          : `形态目标 ${p.target_price.toFixed(2)}`;
        markLines.push({ yAxis: p.target_price, lineStyle: { color: pBearish ? C.down : '#848e9c', type: [5, 4], width: 1, opacity: 0.85 },
          label: { formatter: targetLabel, color: '#fff', fontSize: 9.5, fontWeight: 'bold', lineHeight: 13,
            backgroundColor: pBearish ? C.down : '#5e6673', padding: [3, 5], borderRadius: 3, position: 'insideEndTop' } });
        _signalLines.push({
          value: p.target_price,
          title: `${p.name} 目标价`,
          formula: p.description || '',
          desc: isBearish
            ? `${p.name}是经典看跌形态。跌破颈线后，预计再跌一个头部高度的幅度。\n跌到目标价就止盈平仓。置信度${p.confidence || '?'}%。`
            : `${p.name}是经典看涨形态。突破颈线后，预计再涨一个头部高度的幅度。\n涨到目标价就止盈卖出。置信度${p.confidence || '?'}%。`,
        });
      }
    }
  }

  // ── 标签避让：价位接近的线交替左右分列，超量的降级为无标签细线 ──
  {
    const PRIORITY = { '计划买入': 0, '计划止损': 1, '形态目标': 2, '下行目标': 2,
                       '海龟止损': 5, '历史突破': 6, '历史做空': 7 };
    const keyOf = (ml) => {
      const f = (ml.label && ml.label.formatter) || '';
      for (const k of Object.keys(PRIORITY)) if (f.startsWith(k)) return k;
      return '';
    };
    // a) 方向过滤：建议买入时，做空侧的历史线只是噪声
    const filtered = markLines.filter((ml) => {
      const k = keyOf(ml);
      if (!isBearish && k === '历史做空') return false;
      if (isBearish && k === '历史突破') return false;
      return true;
    });
    // b) 重要度排序 + 限量（最多 5 条带标签）
    filtered.sort((a, b) => (PRIORITY[keyOf(a)] ?? 9) - (PRIORITY[keyOf(b)] ?? 9));
    const LABEL_CAP = 5;
    filtered.forEach((ml, i) => {
      if (i >= LABEL_CAP && ml.label) {
        ml.label = { show: false };
        ml.lineStyle = { ...(ml.lineStyle || {}), opacity: 0.28 };
      }
    });
    // c) 纵向过近的标签左右分列
    const priceRange = klines.length
      ? Math.max(...klines.map(k => k.high)) - Math.min(...klines.map(k => k.low))
      : 0;
    const MIN_GAP = priceRange * 0.045;
    const labeled = filtered.filter((m) => m.label && m.label.show !== false)
      .sort((a, b) => b.yAxis - a.yAxis);
    let lastY = Infinity, flip = false;
    for (const ml of labeled) {
      if (lastY - ml.yAxis < MIN_GAP) {
        flip = !flip;
        if (flip) {
          const pos = ml.label.position || 'insideEndTop';
          ml.label.position = pos.replace('End', 'Start');
        }
      } else {
        flip = false;
      }
      lastY = ml.yAxis;
    }
    markLines.length = 0;
    markLines.push(...filtered);
  }

  // ── Y 轴范围：以 K 线为准，markLine 偏离过远时不参与，避免整段画布被拉空 ──
  let yLo, yHi;
  {
    const lo = Math.min(...klines.map(k => k.low));
    const hi = Math.max(...klines.map(k => k.high));
    const span = hi - lo || hi * 0.1;
    // 价格线只有落在 K 线区间外 25% 以内才纳入，超出则任其画到可视区外
    let mlLo = lo, mlHi = hi;
    for (const ml of markLines) {
      const v = ml.yAxis;
      if (!Number.isFinite(v)) continue;
      if (v >= lo - span * 0.25 && v <= hi + span * 0.25) {
        mlLo = Math.min(mlLo, v);
        mlHi = Math.max(mlHi, v);
      }
    }
    yLo = Math.max(0, mlLo - (mlHi - mlLo) * 0.05);
    yHi = mlHi + (mlHi - mlLo) * 0.07;
  }

  const total = dates.length;
  const defaultDays = Math.min(60, total);
  const ds = total > defaultDays ? (1 - defaultDays / total) * 100 : 0;

  klineChart.setOption({
    backgroundColor: C.bg,
    animation: false,
    xAxis: {
      type: 'category', data: dates,
      axisLine: { lineStyle: { color: C.axis } },
      axisLabel: { color: C.textDim, fontSize: 10 },
      splitLine: { show: false },
    },
    yAxis: {
      scale: true,
      // 显式数值范围。不用函数式 min/max —— ECharts 在 markLine 参与统计时
      // 会传入异常的 v.min/v.max，导致轴上出现 99999999 这类脏刻度。
      min: yLo, max: yHi,
      axisLine: { show: false },
      axisLabel: {
        color: C.textDim, fontSize: 11,
        showMinLabel: false, showMaxLabel: false,   // 首尾是计算出的非整数，无信息量
      },
      splitLine: { lineStyle: { color: C.grid } },
    },
    grid: { left: 60, right: 50, top: 30, bottom: 50 },
    legend: {
      data: ['MA5','MA10','MA20','MA60'],
      top: 4, left: 60,
      textStyle: { color: C.textDim, fontSize: 10 },
      itemWidth: 14, itemHeight: 2,
    },
    series: [
      {
        name: 'K线', type: 'candlestick', data: ohlc,
        itemStyle: { color: C.up, color0: C.down, borderColor: C.up, borderColor0: C.down },
        markPoint: markPoints.length ? { data: markPoints, animation: false } : undefined,
        markLine: markLines.length ? { silent: true, animation: false, data: markLines, symbol: 'none' } : undefined,
      },
      { name: 'MA5', type: 'line', data: ma5, symbol: 'none', itemStyle: { color: C.ma5 }, lineStyle: { color: C.ma5, width: 1.1 } },
      { name: 'MA10', type: 'line', data: ma10, symbol: 'none', itemStyle: { color: C.ma10 }, lineStyle: { color: C.ma10, width: 1.1 } },
      { name: 'MA20', type: 'line', data: ma20, symbol: 'none', itemStyle: { color: C.ma20 }, lineStyle: { color: C.ma20, width: 1.1 } },
      { name: 'MA60', type: 'line', data: ma60, symbol: 'none', itemStyle: { color: C.ma60 }, lineStyle: { color: C.ma60, width: 1.1 } },
    ],
    tooltip: {
      trigger: 'axis', axisPointer: { type: 'cross', lineStyle: { color: '#666' } },
      formatter: (params) => {
        if (!params || !params.length) return '';
        const idx = params[0].dataIndex;
        const k = klines[idx];
        if (!k) return '';
        const isUp = k.close >= k.open;
        const c = isUp ? 'up' : 'down';
        let html = `<div style="font-size:12px;line-height:1.6">
          <div style="color:${C.textDim}">${k.date}</div>
          <div>开 <span class="${c}" style="font-weight:bold">${k.open.toFixed(2)}</span>
               高 <span class="up" style="font-weight:bold">${k.high.toFixed(2)}</span></div>
          <div>收 <span class="${c}" style="font-weight:bold">${k.close.toFixed(2)}</span>
               低 <span class="down" style="font-weight:bold">${k.low.toFixed(2)}</span></div>`;
        if (k.pct) html += `<div style="color:${k.pct>=0?C.up:C.down}">${k.pct>=0?'+':''}${k.pct.toFixed(2)}%</div>`;
        html += `<div style="color:${C.textDim}">量 ${fmtVol(k.volume)}`;
        if (k.amount > 0) html += ` 额 ${fmtVol(k.amount)}`;
        if (k.turnover > 0) html += ` 换手 ${k.turnover.toFixed(1)}%`;
        html += '</div>';
        // MA值
        for (const p of params) {
          if (p.seriesName && p.seriesName.startsWith('MA') && p.value != null) {
            html += `<div style="color:${p.color}">${p.seriesName} ${p.value.toFixed(2)}</div>`;
          }
        }
        html += '</div>';
        return html;
      }
    },
    dataZoom: [
      { type: 'inside', start: ds, end: 100, zoomOnMouseWheel: true, moveOnMouseMove: true, moveOnMouseWheel: false },
      { type: 'slider', start: ds, end: 100, height: 28, bottom: 8,
        borderColor: 'transparent', backgroundColor: 'rgba(255,255,255,0.02)',
        fillerColor: 'rgba(255,255,255,0.06)',
        selectedDataBackground: { lineStyle: { color: '#5470c6' }, areaStyle: { color: 'rgba(91,124,250,0.10)' } },
        dataBackground: { lineStyle: { color: 'rgba(255,255,255,0.14)' }, areaStyle: { color: 'rgba(255,255,255,0.04)' } },
        handleStyle: { color: '#5e6673', borderColor: '#5e6673' },
        moveHandleStyle: { color: '#5470c6' },
        textStyle: { color: C.textDim, fontSize: 10 },
        brushSelect: false,
      },
    ],
  }, true);

  // 成交量
  volumeChart.setOption({
    backgroundColor: C.bg,
    animation: false,
    xAxis: { type: 'category', data: dates, show: false },
    yAxis: { type: 'value', axisLabel: { color: C.textDim, fontSize: 9, formatter: fmtAxisNum }, splitLine: { lineStyle: { color: C.grid } } },
    grid: { left: 60, right: 50, top: 5, bottom: 5 },
    series: [{
      type: 'bar', data: klines.map(k => ({
        value: k.volume,
        itemStyle: { color: k.close >= k.open ? C.up + '88' : C.down + '88' }
      })),
    }],
    tooltip: { trigger: 'axis', formatter: p => p[0] ? `<div style="font-size:11px">${p[0].axisValue}<br/>量 ${fmtVol(p[0].value)}</div>` : '' },
    dataZoom: [
      { type: 'inside', start: ds, end: 100, zoomOnMouseWheel: true, moveOnMouseMove: true },
      { type: 'slider', start: ds, end: 100, show: false },
    ],
  }, true);

  bindZoomSync();
  updateZoomInfo(ds, 100);
  if (currentView !== 'minute') {
    document.getElementById('indicator-toolbar').style.display = 'flex';
  }
  renderIndicator(_currentIndicator);
}

function findEntryIndex(klines, entryPrice) {
  if (!entryPrice) return klines.length - 1;
  let best = 0, bestDiff = Infinity;
  for (let i = 0; i < klines.length; i++) {
    const d = Math.abs(klines[i].close - entryPrice);
    if (d < bestDiff) { bestDiff = d; best = i; }
  }
  return best;
}

// ===== 缩放联动 =====
function bindZoomSync() {
  if (_zoomBound) return;
  _zoomBound = true;
  klineChart.on('datazoom', () => {
    const dz = klineChart.getOption().dataZoom[0];
    if (dz) {
      volumeChart.dispatchAction({ type: 'dataZoom', start: dz.start, end: dz.end });
      indicatorChart.dispatchAction({ type: 'dataZoom', start: dz.start, end: dz.end });
      updateZoomInfo(dz.start, dz.end);
      syncRangeBtns(dz.start, dz.end);
    }
  });
}

function applyRange(days) {
  const total = _klineData.length;
  if (!total) return;
  let s, e;
  if (days === 0 || days >= total) { s = 0; e = 100; }
  else { s = Math.max(0, (1 - days / total) * 100); e = 100; }
  klineChart.dispatchAction({ type: 'dataZoom', start: s, end: e });
  volumeChart.dispatchAction({ type: 'dataZoom', start: s, end: e });
  indicatorChart.dispatchAction({ type: 'dataZoom', start: s, end: e });
  updateZoomInfo(s, e);
}

// ===== 鼠标悬浮信号线/标记点 → 显示计算说明 =====
function bindChartTooltip() {
  let _tooltipBound = false;
  if (_tooltipBound) return;
  _tooltipBound = true;

  const tooltipEl = document.getElementById('signal-tooltip');
  const chartDom = document.getElementById('kline-chart');

  // 用ZRender的mousemove获取像素坐标，再转换为数据值，检测是否靠近信号线/标记点
  klineChart.getZr().on('mousemove', function(e) {
    if (!_signalLines.length && !_signalPoints.length) {
      tooltipEl.style.display = 'none';
      return;
    }

    // 转换像素Y坐标 → Y轴数据值
    let yVal;
    try {
      yVal = klineChart.convertFromPixel({ yAxisIndex: 0 }, e.offsetY);
    } catch(err) {
      tooltipEl.style.display = 'none';
      return;
    }
    if (yVal == null || isNaN(yVal)) {
      tooltipEl.style.display = 'none';
      return;
    }

    // 1. 检测是否靠近水平线（止损/入场/目标）
    let found = null;
    for (const line of _signalLines) {
      if (line.value > 0 && Math.abs(yVal - line.value) / line.value < 0.012) {
        found = line;
        break;
      }
    }

    // 2. 没找到水平线 → 检测是否靠近标记点（买卖信号）
    if (!found && _signalPoints.length) {
      let xIdx;
      try {
        xIdx = Math.round(klineChart.convertFromPixel({ xAxisIndex: 0 }, e.offsetX));
      } catch(err) {}

      if (xIdx != null && !isNaN(xIdx)) {
        for (const pt of _signalPoints) {
          const idx = _klineData.findIndex(k => k.date === pt.date);
          if (idx >= 0 && Math.abs(idx - xIdx) <= 1 && pt.price > 0 && Math.abs(yVal - pt.price) / pt.price < 0.02) {
            found = pt;
            break;
          }
        }
      }
    }

    if (found) {
      tooltipEl.innerHTML =
        '<div class="stt-title">' + found.title + '</div>' +
        (found.formula ? '<div class="stt-formula">' + found.formula + '</div>' : '') +
        (found.desc ? '<div class="stt-desc">' + found.desc + '</div>' : '') +
        '<div class="stt-hint">移开鼠标自动隐藏</div>';
      tooltipEl.style.display = 'block';
      // 放到光标的对侧，避免遮挡正在查看的价位
      const box = klineChart.getDom().getBoundingClientRect();
      const onLeftHalf = e.offsetX < box.width / 2;
      tooltipEl.style.left = onLeftHalf ? 'auto' : '12px';
      tooltipEl.style.right = onLeftHalf ? '12px' : 'auto';
      const th = tooltipEl.offsetHeight || 150;
      const below = e.offsetY + 16;
      tooltipEl.style.top = (below + th > box.height ? Math.max(8, e.offsetY - th - 16) : below) + 'px';
    } else {
      tooltipEl.style.display = 'none';
    }
  });

  klineChart.getZr().on('mouseout', function() {
    tooltipEl.style.display = 'none';
  });
}

function updateZoomInfo(start, end) {
  const total = _klineData.length;
  if (!total) return;
  const si = Math.floor(start / 100 * total);
  const ei = Math.min(total - 1, Math.floor(end / 100 * total));
  const sd = _klineData[si]?.date || '';
  const ed = _klineData[ei]?.date || '';
  document.getElementById('zoom-info').textContent = `${sd} ~ ${ed} (${ei - si + 1}根)`;
}

function syncRangeBtns(start, end) {
  const total = _klineData.length;
  if (!total) return;
  const days = Math.round((end - start) / 100 * total);
  document.querySelectorAll('.tb-btn[data-range]').forEach(b => {
    const r = parseInt(b.dataset.range);
    if (r === 0) b.classList.toggle('active', start === 0 && end === 100);
    else b.classList.toggle('active', Math.abs(days - r) < 5 && end > 99);
  });
}

// ===== 缠论分时分析面板 =====
function renderChanlun(data) {
  const card = document.getElementById('chanlun-card');
  const el = document.getElementById('chanlun-body');
  if (!data || data.error) {
    card.style.display = 'none';
    return;
  }
  card.style.display = 'block';

  const signals = data.signals || [];
  const stateText = data.current_state || '';
  const summary = data.summary || '';

  let html = '';

  // 白话总结（小白模式显示）
  let plainSummary = '';
  if (signals.length > 0) {
    const lastSig = signals[0];
    plainSummary = `缠论分时：${lastSig.type_name}信号，${lastSig.description}`;
  } else if (data.kline_count < 5) {
    plainSummary = '缠论分时：数据不足，5分钟K线少于5根，无法分析';
  } else {
    plainSummary = '缠论分时：暂无买卖信号，等待背驰形成';
  }
  html += `<div class="cl-plain-summary"><b>白话总结：</b>${plainSummary}</div>`;

  // 状态描述
  if (stateText) {
    html += `<div class="cl-state">${stateText}</div>`;
  }

  // 信号列表
  if (signals.length > 0) {
    html += '<div class="cl-signals">';
    for (const sig of signals) {
      const isBuy = sig.type.startsWith('buy');
      const cls = isBuy ? 'cl-signal-buy' : 'cl-signal-sell';
      const tagCls = sig.type;
      html += `<div class="cl-signal-item ${cls}">
        <span class="cl-signal-tag ${tagCls}">${sig.type_name}</span>
        <span class="cl-signal-desc">${sig.description}</span>
        <span class="cl-signal-time">${sig.time}</span>
      </div>`;
    }
    html += '</div>';
  }

  // 统计
  html += `<div class="cl-stats">
    <span>5分K线: <b style="color:#ddd">${data.kline_count}</b></span>
    <span>分型: <b style="color:#ddd">${data.fractal_count}</b></span>
    <span>笔: <b style="color:#ddd">${data.stroke_count}</b></span>
    <span>信号: <b style="color:#ddd">${signals.length}</b></span>
  </div>`;

  el.innerHTML = html;
}

// ===== 缠论日线分析面板 =====
function renderChanlunDaily(data) {
  const card = document.getElementById('chanlun-daily-card');
  const el = document.getElementById('chanlun-daily-body');
  if (!data || data.error) {
    card.style.display = 'none';
    return;
  }
  card.style.display = 'block';

  const signals = data.signals || [];
  const zhongshus = data.zhongshus || [];
  const stateText = data.current_state || '';
  const currentPrice = data.current_price || (_klineData.length ? _klineData[_klineData.length - 1].close : null);

  let html = '';

  // 白话总结（小白模式显示）
  let plainSummary = '';
  const zsLabel = currentView === 'week' ? '缠论周线' : '缠论日线';
  if (signals.length > 0) {
    const lastSig = signals[0];
    plainSummary = `${zsLabel}：${lastSig.type_name}信号，${lastSig.description}`;
  } else {
    plainSummary = `${zsLabel}：暂无买卖信号，等待背驰/中枢突破`;
  }
  if (currentPrice != null && zhongshus && zhongshus.length > 0) {
    const lastZs = zhongshus[zhongshus.length - 1];
    const zd = parseFloat(lastZs.zd), zg = parseFloat(lastZs.zg);
    if (!isNaN(zd) && !isNaN(zg)) {
      if (currentPrice >= zd && currentPrice <= zg) {
        plainSummary += `；当前在中枢[${zd}-${zg}]内震荡`;
      } else if (currentPrice > zg) {
        plainSummary += `；已突破中枢上沿${zg}`;
      } else {
        plainSummary += `；已跌破中枢下沿${zd}`;
      }
    }
  }
  html += `<div class="cl-plain-summary"><b>白话总结：</b>${plainSummary}</div>`;

  if (stateText) {
    html += `<div class="cl-state" style="border-left-color:#7F77DD">${stateText}</div>`;
  }

  // 信号列表
  if (signals.length > 0) {
    html += '<div class="cl-signals">';
    for (const sig of signals) {
      const isBuy = sig.type.startsWith('buy');
      const cls = isBuy ? 'cl-signal-buy' : 'cl-signal-sell';
      const tagCls = sig.type;
      html += `<div class="cl-signal-item ${cls}">
        <span class="cl-signal-tag ${tagCls}">${sig.type_name}</span>
        <span class="cl-signal-desc">${sig.description}</span>
        <span class="cl-signal-time">${sig.date}</span>
      </div>`;
    }
    html += '</div>';
  } else {
    html += '<div style="color:#555;font-size:12px;padding:6px 0">暂无买卖信号，等待背驰/中枢突破</div>';
  }

  // 当前价格与所处中枢判断
  let currentZs = null;
  if (currentPrice != null && zhongshus.length > 0) {
    for (const zs of zhongshus) {
      const zd = parseFloat(zs.zd);
      const zg = parseFloat(zs.zg);
      if (!isNaN(zd) && !isNaN(zg) && currentPrice >= zd && currentPrice <= zg) {
        currentZs = zs; break;
      }
    }
  }

  // 中枢信息
  if (zhongshus.length > 0) {
    html += '<div style="margin-top:6px;font-size:11px;color:#666;border-top:1px solid #0d0d0d;padding-top:4px">中枢列表</div>';
    if (currentZs) {
      html += `<div style="margin:4px 0;padding:5px 8px;background:#1a1200;border:1px solid var(--ac-2)44;border-radius:4px;font-size:11px;color:var(--ac-2)">
        当前价格 <b>${currentPrice.toFixed(2)}</b> 处于中枢 <b>[${currentZs.zd} - ${currentZs.zg}]</b> 内，区间上沿压力 ${currentZs.zg}，下沿支撑 ${currentZs.zd}
      </div>`;
    } else if (currentPrice != null) {
      const lastZs = zhongshus[zhongshus.length - 1];
      const zd = parseFloat(lastZs.zd), zg = parseFloat(lastZs.zg);
      const pos = currentPrice > zg ? `上沿 ${zg} 之上` : `下沿 ${zd} 之下`;
      const hint = currentPrice > zg ? '已向上突破，关注回踩能否站稳' : '已跌破中枢，关注是否形成第三类卖点';
      html += `<div style="margin:4px 0;padding:5px 8px;background:#0d1a0d;border:1px solid var(--down)44;border-radius:4px;font-size:11px;color:#aaa">
        当前价格 <b>${currentPrice.toFixed(2)}</b> 位于最新中枢 [${lastZs.zd} - ${lastZs.zg}] ${pos}，${hint}
      </div>`;
    }
    for (const zs of zhongshus.slice(-4)) {
      const isCurrent = currentZs && currentZs === zs;
      const brokenCls = zs.is_broken ? 'cl-zhongshu-broken' : '';
      const currentCls = isCurrent ? 'cl-zhongshu-current' : '';
      const dirText = zs.is_broken ? (zs.break_direction === 'up' ? '向上突破' : '向下突破') : '震荡中';
      const currentTag = isCurrent ? '<span style="color:var(--ac-2);font-weight:bold;margin-right:4px">[当前]</span>' : '';
      html += `<div class="cl-zhongshu ${brokenCls} ${currentCls}">
        ${currentTag}[${zs.zd} - ${zs.zg}] ${zs.start_date}~${zs.end_date} ${dirText}
      </div>`;
    }
  }

  // 统计
  html += `<div class="cl-stats">
    <span>${currentView === 'week' ? '周K' : '日K'}: <b style="color:#ddd">${data.kline_count}</b></span>
    <span>合并: <b style="color:#ddd">${data.merged_count}</b></span>
    <span>分型: <b style="color:#ddd">${data.fractal_count}</b></span>
    <span>笔: <b style="color:#ddd">${data.stroke_count}</b></span>
    <span>中枢: <b style="color:#ddd">${data.zhongshu_count}</b></span>
    <span>信号: <b style="color:#ddd">${signals.length}</b></span>
  </div>`;

  el.innerHTML = html;
}

// ===== 日K线缠论图表叠加 =====
function applyChanlunDailyOverlay(data) {
  if (!data || !klineChart) return;

  const chartSignals = data.chart_signals || [];
  const chartFractals = data.chart_fractals || [];
  const chartZhongshus = data.chart_zhongshus || [];
  const chartStrokes = data.chart_strokes || [];

  // 获取当前K线series的markPoint和markLine（保留已有的买卖点标记）
  const opt = klineChart.getOption();
  const klineSeries = opt.series.find(s => s.type === 'candlestick');
  if (!klineSeries) return;

  // 合并markPoint：原有的买卖点 + 缠论买卖点 + 分型
  const existingMarkPoints = (klineSeries.markPoint && klineSeries.markPoint.data) || [];
  const clMarkPoints = [];

  // 缠论买卖点标记——买入▲放K线下方，卖出▼放K线上方
  const _chanlunExplain = {
    'buy1': '一类买点：价格创新低但MACD力度背驰（下上下三段，后段低点更低但力度更弱），认为是趋势底部。缠论中最强的买点。',
    'buy2': '二类买点：中枢形成后价格回踩不破中枢上沿。次强买点，出现在一类买点之后。',
    'buy3': '三类买点：中枢突破后价格回踩不破中枢上沿。确认性买点，趋势已确认向上。',
    'sell1': '一类卖点：价格创新高但MACD力度背驰（上下上三段，后段高点更高但力度更弱），认为是趋势顶部。缠论中最强的卖点。',
    'sell2': '二类卖点：中枢形成后价格反弹不破中枢下沿。次强卖点，出现在一类卖点之后。',
    'sell3': '三类卖点：中枢跌破后价格反弹不破中枢下沿。确认性卖点，趋势已确认向下。',
  };
  for (const sig of chartSignals) {
    const isBuy = sig.symbol === 'triangle';
    const sigDate = sig.coord[0];
    const sigPrice = sig.coord[1];
    // 在K线数据中查找对应日期的蜡烛
    const candle = _klineData.find(k => k.date === sigDate);
    let markerY = sigPrice;
    if (candle) {
      const range = candle.high - candle.low;
      const offset = Math.max(range * 0.6, sigPrice * 0.008);
      markerY = isBuy ? candle.low - offset : candle.high + offset;
    }
    clMarkPoints.push({
      coord: [sigDate, markerY],
      symbol: isBuy ? 'triangle' : 'triangle',
      symbolSize: 18,
      symbolRotate: isBuy ? 0 : 180,
      itemStyle: sig.itemStyle,
      label: {
        show: true,
        formatter: sig.label?.formatter || (isBuy ? '买' : '卖'),
        fontSize: 10,
        fontWeight: 'bold',
        color: sig.label?.color || (isBuy ? C.up : C.down),
        position: isBuy ? 'bottom' : 'top',
      },
    });
    const sigType = sig.type || (isBuy ? 'buy1' : 'sell1');
    _signalPoints.push({
      date: sigDate, price: markerY,
      title: sig.label?.formatter ? `缠论·${sig.label.formatter}` : (isBuy ? '缠论买点' : '缠论卖点'),
      formula: `信号价位 ${sigPrice}`,
      desc: _chanlunExplain[sigType] || (isBuy ? '缠论买点信号' : '缠论卖点信号'),
    });
  }

  // 分型标记
  for (const f of chartFractals) {
    clMarkPoints.push({
      coord: f.coord,
      symbol: f.symbol,
      symbolSize: f.symbolSize,
      itemStyle: f.itemStyle,
    });
  }

  // 中枢矩形用markArea
  const markAreas = chartZhongshus.map(zs => ([
    { xAxis: zs.xAxis[0], yAxis: zs.yAxis[0] },
    { xAxis: zs.xAxis[1], yAxis: zs.yAxis[1],
      itemStyle: zs.itemStyle },
  ]));

  // 笔的连线用markLine
  const strokeLines = chartStrokes.map(s => ([
    { coord: s.coords[0] },
    { coord: s.coords[1], lineStyle: s.lineStyle },
  ]));

  // 合并markLine：原有的止损/目标价 + 缠论笔
  const existingMarkLines = (klineSeries.markLine && klineSeries.markLine.data) || [];

  klineChart.setOption({
    series: [{
      name: 'K线',
      markPoint: {
        data: [...existingMarkPoints, ...clMarkPoints],
        animation: false,
      },
      markLine: {
        silent: true,
        animation: false,
        symbol: 'none',
        data: [...existingMarkLines, ...strokeLines],
      },
      markArea: markAreas.length ? {
        silent: true,
        animation: false,
        data: markAreas,
      } : undefined,
    }],
  });
}
function renderMinute(data, chanlunData) {
  const pre = data.pre_close;
  const prices = data.prices;
  const avgs = data.avg_prices;
  const times = data.times;
  const vols = data.volumes;

  // 固定Y轴范围：用昨收价±10%（或±20%），防止跳动
  // 创业板/科创板/北交所 = ±20%，其他 = ±10%
  if (!_minuteYRange || _minuteYRange.pre !== pre) {
    const is20pct = currentSymbol && (
      currentSymbol.startsWith('300') || currentSymbol.startsWith('688') ||
      currentSymbol.startsWith('920') || currentSymbol.startsWith('8')
    );
    const pct = is20pct ? 0.20 : 0.10;
    _minuteYRange = {
      pre: pre,
      min: pre * (1 - pct),
      max: pre * (1 + pct),
    };
  }
  const yMin = _minuteYRange.min;
  const yMax = _minuteYRange.max;

  const lastP = prices.filter(p => p > 0).slice(-1)[0] || pre;
  const pColor = lastP >= pre ? C.up : C.down;

  // 构建缠论买卖点标记
  const markPoints = [];
  if (chanlunData && chanlunData.signals) {
    for (const sig of chanlunData.signals) {
      const isBuy = sig.type.startsWith('buy');
      const timeIdx = times.indexOf(sig.time);
      const t = timeIdx >= 0 ? sig.time : times[times.length - 1];
      markPoints.push({
        coord: [t, sig.price],
        symbol: isBuy ? 'triangle' : 'pin',
        symbolSize: 16,
        symbolRotate: isBuy ? 0 : 180,
        itemStyle: {
          color: isBuy ? C.up : C.down,
          borderWidth: 2,
          borderColor: '#fff',
        },
        label: {
          show: true,
          formatter: sig.type_name,
          fontSize: 9,
          fontWeight: 'bold',
          color: '#fff',
          position: isBuy ? 'bottom' : 'top',
          backgroundColor: isBuy ? C.up : C.down,
          padding: [2, 4],
          borderRadius: 2,
        },
      });
    }
  }

  // 构建分型标记（小圆点）
  const fractalMarks = [];
  if (chanlunData && chanlunData.fractals) {
    for (const f of chanlunData.fractals) {
      const timeIdx = times.indexOf(f.time);
      if (timeIdx < 0) continue;
      fractalMarks.push({
        coord: [f.time, f.price],
        symbol: 'circle',
        symbolSize: 6,
        itemStyle: {
          color: f.type === 'top' ? 'var(--down)' : 'var(--up)',
          borderColor: '#fff',
          borderWidth: 1,
        },
      });
    }
  }

  minuteChart.setOption({
    backgroundColor: C.bg,
    animation: false,
    xAxis: {
      type: 'category', data: times,
      axisLine: { lineStyle: { color: C.axis } },
      axisLabel: { color: C.textDim, fontSize: 10, interval: Math.floor(times.length / 6) },
      splitLine: { show: true, lineStyle: { color: C.grid, type: 'dashed' } },
    },
    yAxis: {
      type: 'value', min: yMin, max: yMax,
      axisLine: { show: false },
      axisLabel: {
        color: C.textDim, fontSize: 11,
        formatter: v => {
          const pct = ((v - pre) / pre * 100).toFixed(2);
          return v.toFixed(2) + '\n' + (pct > 0 ? '+' : '') + pct + '%';
        }
      },
      splitLine: { lineStyle: { color: C.grid, type: 'dashed' } },
    },
    grid: { left: 70, right: 60, top: 10, bottom: 25 },
    series: [
      {
        name: '价格', type: 'line', data: prices, symbol: 'none',
        lineStyle: { color: pColor, width: 1.5 },
        areaStyle: { color: pColor === C.up ? 'rgba(246,70,93,0.09)' : 'rgba(14,203,129,0.09)' },
        markLine: { silent: true, symbol: 'none', animation: false,
          data: [{ yAxis: pre, lineStyle: { color: C.preClose, type: 'dashed', width: 1 },
            label: { formatter: '昨收 ' + pre.toFixed(3), color: C.textDim, fontSize: 10, position: 'insideEndTop' } }]
        },
        markPoint: (markPoints.length || fractalMarks.length) ? {
          data: [...markPoints, ...fractalMarks],
          animation: false,
        } : undefined,
      },
      { name: '均价', type: 'line', data: avgs, symbol: 'none',
        lineStyle: { color: C.avgLine, width: 1, type: 'dashed' } },
    ],
    tooltip: {
      trigger: 'axis', axisPointer: { type: 'cross', lineStyle: { color: '#666' } },
      formatter: (params) => {
        if (!params || !params.length) return '';
        let html = `<div style="font-size:12px;line-height:1.6"><div style="color:${C.textDim}">${params[0].axisValue}</div>`;
        for (const p of params) {
          if (p.value > 0) {
            const pct = ((p.value - pre) / pre * 100).toFixed(2);
            const c = p.value >= pre ? C.up : C.down;
            html += `<div><span style="color:${p.color}">●</span> ${p.seriesName} <span style="color:${c};font-weight:bold">${p.value.toFixed(3)}</span> <span style="color:${c}">(${pct>0?'+':''}${pct}%)</span></div>`;
          }
        }
        return html + '</div>';
      }
    },
  }, true);

  // 分时量
  const vc = vols.map((v, i) => {
    if (v === 0) return { value: 0, itemStyle: { color: '#222' } };
    const p = prices[i] || 0;
    return { value: v, itemStyle: { color: p >= pre ? C.up + '66' : C.down + '66' } };
  });
  minuteVolChart.setOption({
    backgroundColor: C.bg,
    animation: false,
    xAxis: { type: 'category', data: times, show: false },
    yAxis: { type: 'value', axisLabel: { color: C.textDim, fontSize: 9, formatter: fmtAxisNum }, splitLine: { lineStyle: { color: C.grid } } },
    grid: { left: 70, right: 60, top: 5, bottom: 5 },
    series: [{ type: 'bar', data: vc }],
    tooltip: { trigger: 'axis', formatter: p => p[0] ? `<div style="font-size:11px">${p[0].axisValue}<br/>量 ${fmtVol(p[0].value)}</div>` : '' },
  }, true);
}

// ===== 资金流 =====
function renderFlow(flows) {
  _dailyFlows = flows;  // 缓存日级数据，供模式切换时使用
  if (_flowMode === 'realtime') {
    // 实时模式：不渲染日级图表，由loadRealtimeFlow处理
    loadRealtimeFlow(currentSymbol);
    return;
  }
  _renderDailyFlow(flows);
}

function _renderDailyFlow(flows) {
  const fs = document.getElementById('flow-summary');
  if (!flows || !flows.length) {
    fs.textContent = '';
    flowChart.setOption({ title: { text: '无资金流数据', left: 'center', top: 'center', textStyle: { color: C.textDim, fontSize: 13 } } }, true);
    return;
  }
  // 近5日主力净流入摘要
  const recent = flows.slice(-5);
  const totalMain = recent.reduce((s, f) => s + f.main_net, 0);
  const totalMainYi = (totalMain / 1e8).toFixed(2);
  fs.innerHTML = `近5日主力 <span style="color:${totalMain>=0?C.up:C.down};font-weight:bold">${totalMain>=0?'+':''}${totalMainYi}亿</span>`;

  const dates = flows.map(f => f.date);
  const mainNet = flows.map(f => +(f.main_net / 1e8).toFixed(3));
  const superLarge = flows.map(f => +(f.super_large_net / 1e8).toFixed(3));

  flowChart.setOption({
    backgroundColor: C.bg,
    animation: false,
    legend: { data: ['主力净流入', '超大单'], textStyle: { color: C.textDim, fontSize: 10 }, top: 2, itemWidth: 12, itemHeight: 8 },
    xAxis: { type: 'category', data: dates, axisLabel: { color: C.textDim, fontSize: 9 }, axisLine: { lineStyle: { color: C.axis } } },
    yAxis: { type: 'value', axisLabel: { color: C.textDim, fontSize: 9, formatter: fmtAxisNum }, splitLine: { lineStyle: { color: C.grid } } },
    grid: { left: 50, right: 20, top: 22, bottom: 18 },
    series: [
      { name: '主力净流入', type: 'bar', data: mainNet.map(v => ({ value: v, itemStyle: { color: v >= 0 ? C.up + '88' : C.down + '88' } })) },
      { name: '超大单', type: 'line', data: superLarge, symbol: 'circle', symbolSize: 3, lineStyle: { color: C.ma20, width: 1 } },
    ],
    tooltip: { trigger: 'axis', formatter: p => {
      let html = `<div style="font-size:11px">${p[0].axisValue}</div>`;
      for (const x of p) html += `<div><span style="color:${x.color}">●</span> ${x.seriesName}: ${x.value>=0?'+':''}${x.value.toFixed(2)}亿</div>`;
      return html;
    }},
  }, true);
}

// ===== 盘中实时资金流 =====
function switchFlowMode(mode) {
  _flowMode = mode;
  // 更新按钮状态
  document.getElementById('ft-rt').classList.toggle('ft-active', mode === 'realtime');
  document.getElementById('ft-daily').classList.toggle('ft-active', mode === 'daily');
  if (mode === 'realtime') {
    loadRealtimeFlow(currentSymbol);
  } else {
    _renderDailyFlow(_dailyFlows);
  }
}

async function loadRealtimeFlow(symbol) {
  if (!symbol) return;
  try {
    const r = await fetch(`${API}/api/realtime_flow?symbol=${symbol}`);
    const data = await r.json();
    renderRealtimeFlow(data);
  } catch(e) {
    const fs = document.getElementById('flow-summary');
    fs.textContent = '实时资金流获取失败';
  }
}

function renderRealtimeFlow(data) {
  const fs = document.getElementById('flow-summary');
  if (data.error || !data.flows || !data.flows.length) {
    fs.textContent = data.error || '暂无实时资金流数据';

  const flows = data.flows;
  const summary = data.summary || {};

  fs.innerHTML = `今日主力 <span style="color:${summary.main_net>=0?C.up:C.down};font-weight:bold">${summary.main_net>=0?'+':''}${mainNetYi}亿</span> | 超大单 <span style="color:${summary.super_large_net>=0?C.up:C.down};font-weight:bold">${summary.super_large_net>=0?'+':''}${superLargeYi}亿</span>`;

  const times = flows.map(f => f.time);

  const lastMain = mainNet.length ? mainNet[mainNet.length - 1] : 0;

  flowChart.setOption({
    backgroundColor: C.bg,
    animation: false,
